ronic music”—a term that always suggested the future, however vague—was demonstrated to be as familiar and comforting as classic rock, and no less real in its depth of feeling.<br />\nYou can easily trace <i>Discovery</i> forward to EDM and the continuing entwinement of techno and rock. But you can also trace it back to The Beatles circa <i>Sgt. Pepper’s Lonely Hearts Club Band</i> or The Beach Boys circa <i>Pet Sounds</i> and <i>Smile</i>: music that took pop seriously as art, but also recontextualized older, seemingly uncool styles in ways that felt progressive and fresh. Most of all, though, Daft Punk wanted to be universal. And as implausible as it may have seemed for two French men in robot helmets, <i>Discovery</i> got them there. “We hope all the kids will love the video,” a disembodied voice says near the end of the promo clip. “As well as their parents.”"}, "showExplicitBadge": false, "audioBadges": {"dolbyAtmos": false, "dolbyAudio": false, "lossless": true, "hiResLossless": false, "digitalMaster": false}, "contentDescriptor": {"kind": "album", "identifiers": {"storeAdamID": "697194953"}, "url": "https://music.apple.com/us/album/discovery/697194953"}, "playButton": {"id": "play-button-non-subscriber-697194953", "segue": {"$kind": "playAction", "actionMetrics": {"data": [{"fields": {"actionType": "play", "actionDetails": {"playType": "all", "kind": "album"}, "actionUrl": "https://music.apple.com/us/album/discovery/697194953", "actionContext": "button", "eventType": "click", "targetType": "AlbumDetail", "targetId": "697194953", "eventVersion": 5}, "includingFields": ["pageFields", "impressionsSnapshot", "languages", "clickLocation"], "excludingFields": [], "shouldFlush": false}], "custom": {}}, "items": [{"contentDescriptor": {"kind": "album", "identifiers": {"storeAdamID": "697194953"}, "url": "https://music.apple.com/us/album/discovery/697194953"}}], "containerContentDescriptor": {"kind": "album", "identifiers": {"storeAdamID": "697194953"}, "url": "https:
